<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>QuireStreak Adaptive Icon Foreground</title>
  <desc>Export at 1024×1024 px as adaptive-icon.png. Android crops to a circle/squircle; keep art within the safe zone (scale 0.76). Background color #1A1714 is set in app.json.</desc>
  <g transform="translate(512,512) scale(0.76) translate(-528,-534)">
    <defs>
      <mask id="cut" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1500" height="1500">
        <rect x="-200" y="-200" width="1500" height="1500" fill="#fff"/>
        <g transform="translate(610,600) rotate(-38)">
          <path d="M-58 0 H58 V290 L0 232 L-58 290 Z" fill="#000" stroke="#000" stroke-width="22" stroke-linejoin="round"/>
        </g>
      </mask>
    </defs>
    <circle cx="490" cy="470" r="230" fill="none" stroke="#FAF7F2" stroke-width="96" mask="url(#cut)"/>
    <g transform="translate(610,600) rotate(-38)">
      <path d="M-58 0 H58 V290 L0 232 L-58 290 Z" fill="#D9531E"/>
    </g>
  </g>
</svg>
